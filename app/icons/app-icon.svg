<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2230"/><stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/><stop offset="1" stop-color="#1f6fe0"/>
    </linearGradient>
    <radialGradient id="platter" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#2a2f3b"/><stop offset="1" stop-color="#11131a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- base estilo macOS (cuadrado redondeado con margen) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <!-- jog wheel -->
  <circle cx="512" cy="540" r="262" fill="url(#platter)" stroke="#000" stroke-opacity=".5" stroke-width="6"/>
  <circle cx="512" cy="540" r="230" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
  <circle cx="512" cy="540" r="200" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
  <circle cx="512" cy="540" r="170" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
  <!-- anillo de progreso con brillo -->
  <path d="M512 302a238 238 0 1 1-206 119" fill="none" stroke="#2f9bff" stroke-width="34" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>
  <path d="M512 302a238 238 0 1 1-206 119" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
  <!-- centro -->
  <circle cx="512" cy="540" r="84" fill="#0d0f14" stroke="#343a47" stroke-width="10"/>
  <circle cx="512" cy="540" r="14" fill="#5fb4ff"/>
  <!-- marcador de posición -->
  <rect x="498" y="330" width="28" height="96" rx="14" fill="#f2f4f8"/>
  <!-- ondas de "remoto" -->
  <g fill="none" stroke="#f2f4f8" stroke-linecap="round" stroke-width="26">
    <path d="M700 238a110 110 0 0 1 86 86" opacity=".95"/>
    <path d="M704 166a182 182 0 0 1 154 154" opacity=".55"/>
  </g>
  <circle cx="704" cy="320" r="20" fill="#f2f4f8"/>
</svg>
